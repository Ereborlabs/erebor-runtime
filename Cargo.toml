[workspace]
members = [
    "crates/erebor-interceptor",
    "crates/erebor-interceptor-abi",
    "crates/erebor-runtime-audit",
    "crates/erebor-runtime-approvals",
    "crates/erebor-runtime-cdp",
    "crates/erebor-runtime-client",
    "crates/erebor-runtime-cli",
    "crates/erebor-runtime-core",
    "crates/erebor-runtime-context",
    "crates/erebor-runtime-daemon",
    "crates/erebor-runtime-e2e",
    "crates/erebor-runtime-error",
    "crates/erebor-telemetry",
    "crates/erebor-runtime-events",
    "crates/erebor-runtime-filesystem",
    "crates/erebor-runtime-ipc",
    "crates/erebor-runtime-policy",
    "crates/erebor-runtime-packages",
    "crates/erebor-runtime-session",
    "crates/erebor-runtime-terminal",
    "crates/mithril-control",
    "crates/mithril-e2e",
    "crates/mithril-node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ereborlabs/erebor-runtime"

[workspace.dependencies]
axum = { version = "0.7.9", features = ["json"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
cdp-protocol = "0.3.1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7.2.1"
containerd-client = "=0.8.0"
crossterm = "0.29.0"
ed25519-dalek = "3.0.0"
futures-util = "0.3"
gix = { git = "https://github.com/nhaghighat/gitoxide", rev = "f803d3ea2efd54f18cafea76129e4c07e3e2eab9", default-features = false, features = ["parallel", "sha1", "sha256", "tree-editor"] }
hex = "0.4.3"
hyper-util = { version = "0.1", features = ["tokio"] }
k8s-cri = "=0.9.0"
k8s-openapi = { version = "0.28.0", features = ["v1_35"] }
kube = { version = "4.2.0", default-features = false, features = ["admission", "client", "config", "ring", "rustls-tls", "ws"] }
json-patch = "4.2.0"
schemars = "1.2.2"
prost = "0.13"
rmp-serde = "1.3.0"
prost-build = "0.13"
prost-types = "0.13"
procfs = { version = "0.18.0", default-features = false }
libbpf-rs = { version = "=0.27.0", features = ["vendored"] }
libbpf-cargo = "=0.27.0"
minicbor = { version = "2.3.0", features = ["derive", "half", "std"] }
openidconnect = "4.0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde-saphyr = "1.0.1"
sha2 = "0.10"
snafu = "0.8"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.26"
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10.3"
toml = "1.1.2"
tonic = { version = "=0.12.3", features = ["tls"] }
tonic-build = "=0.12.3"
tower = { version = "0.4", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4"] }
zerocopy = { version = "0.8", features = ["derive"] }
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
