[package]
name = "araphor-analysis-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
araphor-graph = { path = "../araphor-graph" }
arrow-array = "=59.2.0"
arrow-buffer = "=59.2.0"
arrow-cast = "=59.2.0"
arrow-data = "=59.2.0"
arrow-ipc = "=59.2.0"
arrow-schema = { version = "=59.2.0", features = ["serde"] }
erebor-runtime-error = { path = "../erebor-runtime-error" }
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
wit-bindgen = { version = "=0.61.1", optional = true, default-features = false, features = ["macros", "realloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oci-spec = { version = "=0.10.0", optional = true, default-features = false, features = ["image"] }
tar = { version = "=0.4.46", optional = true, default-features = false }
sha2 = { workspace = true, optional = true }

[features]
oci = ["dep:oci-spec", "dep:tar", "dep:sha2"]
guest = ["dep:wit-bindgen"]
native = ["guest", "arrow-array/ffi"]

[dev-dependencies]
flatbuffers = "=25.12.19"
tempfile = "3.23.0"
wit-parser = "=0.258.3"

[lints]
workspace = true
