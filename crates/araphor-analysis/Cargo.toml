[package]
name = "araphor-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-fixtures = ["araphor-data/test-fixtures", "araphor-query/test-fixtures"]

[dependencies]
araphor-analysis-builtins = { path = "../araphor-analysis-builtins" }
araphor-analysis-sdk = { path = "../araphor-analysis-sdk", features = ["native", "oci"] }
araphor-data = { path = "../araphor-data" }
araphor-query = { path = "../araphor-query" }
arrow-cast = "=58.4.0"
arrow-ipc = "=58.4.0"
arrow-json = "=58.4.0"
arrow-schema = "=58.4.0"
erebor-interceptor-abi = { path = "../erebor-interceptor-abi" }
erebor-runtime-error = { path = "../erebor-runtime-error" }
futures-util.workspace = true
libloading = "=0.9.0"
minicbor.workspace = true
object = { version = "=0.40.0", default-features = false, features = ["read", "std"] }
prost.workspace = true
rustix = { version = "1.1.4", features = ["fs", "process"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
snafu.workspace = true
tempfile = "3.23.0"
time.workspace = true
tokio.workspace = true
uuid.workspace = true
wasmtime = { version = "=49.0.2", default-features = false, features = ["component-model", "runtime", "cranelift", "std"] }
wasmparser = "=0.258.3"

[dev-dependencies]
araphor-data = { path = "../araphor-data", features = ["test-fixtures"] }
araphor-query = { path = "../araphor-query", features = ["test-fixtures"] }
crc32c.workspace = true
duckdb.workspace = true
prost.workspace = true
wat = "=1.258.3"

[lints]
workspace = true
