[package]
name = "araphor-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
araphor-analysis-builtins = { path = "../araphor-analysis-builtins" }
datafusion = { version = "=53.1.0", default-features = false, features = ["sql", "nested_expressions", "encoding_expressions", "string_expressions", "unicode_expressions", "recursive_protection"] }
araphor-analysis-sdk = { path = "../araphor-analysis-sdk" }
araphor-discovery-definition = { path = "../araphor-discovery-definition" }
araphor-package = { path = "../araphor-package" }
araphor-data = { path = "../araphor-data" }
araphor-query = { path = "../araphor-query" }
erebor-runtime-error = { path = "../erebor-runtime-error" }
erebor-telemetry = { path = "../erebor-telemetry" }
erebor-interceptor-abi = { path = "../erebor-interceptor-abi" }
futures-util.workspace = true
serde.workspace = true
serde_bytes = "=0.11.19"
serde_json.workspace = true
serde_arrow = { version = "=0.15.1", default-features = false, features = ["arrow-58"] }
snafu.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
araphor-detector-example = { path = "../araphor-detector-example" }
araphor-query = { path = "../araphor-query", features = ["test-fixtures"] }
araphor-data = { path = "../araphor-data", features = ["test-fixtures"] }
prost.workspace = true
tempfile = "3.23.0"

[lints]
workspace = true
