[package]
name = "araphor-data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-fixtures = []

[dependencies]
araphor-analysis-builtins = { path = "../araphor-analysis-builtins" }
araphor-analysis-sdk = { path = "../araphor-analysis-sdk", features = ["native", "oci"] }
arrow-ipc = "=58.4.0"
arrow-json = "=58.4.0"
crc32c.workspace = true
duckdb = { workspace = true, features = ["json", "vtab", "appender-arrow"] }
erebor-interceptor-abi = { path = "../erebor-interceptor-abi" }
erebor-runtime-error = { path = "../erebor-runtime-error" }
futures-core = "0.3"
futures-util.workspace = true
minicbor.workspace = true
object = { version = "=0.40.0", default-features = false, features = ["read", "std"] }
prost.workspace = true
rustix = { version = "1.1.4", features = ["fs", "process"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
snafu.workspace = true
time.workspace = true
tempfile = { version = "3.23.0" }
tokio.workspace = true
uuid.workspace = true

[build-dependencies]
prost-build.workspace = true

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
