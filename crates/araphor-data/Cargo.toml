[package]
name = "araphor-data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-fixtures = ["dep:tempfile"]

[dependencies]
araphor-analysis-builtins = { path = "../araphor-analysis-builtins" }
araphor-analysis-sdk = { path = "../araphor-analysis-sdk" }
arrow-ipc = "=58.4.0"
arrow-json = "=58.4.0"
crc32c.workspace = true
duckdb = { workspace = true, features = ["json", "vtab", "appender-arrow"] }
erebor-interceptor-abi = { path = "../erebor-interceptor-abi" }
erebor-runtime-error = { path = "../erebor-runtime-error" }
futures-core = "0.3"
minicbor.workspace = true
prost.workspace = true
rustix = { version = "1.1.4", features = ["fs", "process"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
snafu.workspace = true
sqlparser.workspace = true
time.workspace = true
tempfile = { version = "3.23.0", optional = true }
tokio.workspace = true
uuid.workspace = true
wasmtime = { version = "=49.0.2", default-features = false, features = ["component-model", "runtime", "cranelift", "std"] }
wasmparser = "=0.258.3"

[build-dependencies]
prost-build.workspace = true

[dev-dependencies]
futures-util.workspace = true
tempfile = "3.23.0"
wat = "=1.258.3"

[lints]
workspace = true
