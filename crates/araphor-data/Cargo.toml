[package]
name = "araphor-data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-fixtures = []

[dependencies]
araphor-discovery-definition = { path = "../araphor-discovery-definition" }
araphor-package = { path = "../araphor-package" }
araphor-analysis-builtins = { path = "../araphor-analysis-builtins" }
araphor-graph = { path = "../araphor-graph" }
araphor-analysis-sdk = { path = "../araphor-analysis-sdk" }
arrow-ipc = "=58.4.0"
arrow-json = "=58.4.0"
crc32c.workspace = true
duckdb = { workspace = true, features = ["json", "vtab", "appender-arrow"] }
erebor-interceptor-abi = { path = "../erebor-interceptor-abi" }
erebor-runtime-error = { path = "../erebor-runtime-error" }
futures-core = "0.3"
futures-util.workspace = true
minicbor.workspace = true
rmp-serde.workspace = true
prost.workspace = true
rustix = { version = "1.1.4", features = ["fs", "process"] }
schemars.workspace = true
serde.workspace = true
serde_bytes = "=0.11.19"
serde_arrow = { version = "=0.15.1", default-features = false, features = ["arrow-58"] }
serde_json.workspace = true
sha2.workspace = true
snafu.workspace = true
time.workspace = true
tempfile = { version = "3.23.0" }
tokio.workspace = true
tokio-util = { version = "0.7.19", features = ["rt"] }
uuid = { workspace = true, features = ["serde"] }
zerocopy.workspace = true

[build-dependencies]
prost-build.workspace = true

[dev-dependencies]
flatbuffers = "=25.12.19"
tempfile = "3.23.0"

[lints]
workspace = true
