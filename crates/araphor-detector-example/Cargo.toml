[package]
name = "araphor-detector-example"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
araphor-analysis-sdk = { path = "../araphor-analysis-sdk", features = ["guest"] }
araphor-analysis-builtins = { path = "../araphor-analysis-builtins" }

[dev-dependencies]
araphor-component-build = { path = "../araphor-component-build" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
araphor-analysis-sdk = { path = "../araphor-analysis-sdk", features = ["native"] }
