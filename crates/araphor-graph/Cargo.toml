[package]
name = "araphor-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
store = ["dep:duckdb", "dep:erebor-telemetry"]

[dependencies]
arrow-array = "=59.2.0"
arrow-schema = "=59.2.0"
arrow-select = "=59.2.0"
arrow-cast = "=59.2.0"
duckdb = { workspace = true, optional = true, features = ["appender-arrow"] }
erebor-runtime-error = { path = "../erebor-runtime-error" }
erebor-telemetry = { path = "../erebor-telemetry", optional = true }
snafu.workspace = true

[dev-dependencies]
araphor-analysis-types = { path = "../araphor-analysis-types" }
arrow-buffer = "=59.2.0"
arrow-ipc = "=59.2.0"
fjall = "=3.1.13"
redb = "=4.4.0"
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3.23.0"

[[example]]
name = "storage_poc"
path = "examples/storage_poc/main.rs"
required-features = ["store"]

[lints]
workspace = true
