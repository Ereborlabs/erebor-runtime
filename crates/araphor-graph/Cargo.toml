[package]
name = "araphor-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
store = ["dep:duckdb", "dep:erebor-telemetry"]
native-store = ["dep:fjall", "dep:arrow-ipc", "dep:rmp-serde", "dep:serde"]

[dependencies]
arrow-array = "=59.2.0"
arrow-schema = "=59.2.0"
arrow-select = "=59.2.0"
arrow-cast = "=59.2.0"
duckdb = { workspace = true, optional = true, features = ["appender-arrow"] }
erebor-runtime-error = { path = "../erebor-runtime-error" }
erebor-telemetry = { path = "../erebor-telemetry", optional = true }
snafu.workspace = true
fjall = { path = "../../fjall", version = "=3.1.13", features = ["journal-cdc"], optional = true }
arrow-ipc = { version = "=59.2.0", optional = true }
rmp-serde = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
araphor-analysis-builtins = { path = "../araphor-analysis-builtins" }
araphor-analysis-sdk = { path = "../araphor-analysis-sdk" }
araphor-analysis-types = { path = "../araphor-analysis-types" }
arrow-buffer = "=59.2.0"
arrow-ipc = "=59.2.0"
crc32c.workspace = true
fjall = { path = "../../fjall", version = "=3.1.13", features = ["journal-cdc"] }
log = "=0.4.29"
redb = "=4.4.0"
surrealkv = "=1.2.0"
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes = "=0.11.19"
serde_arrow = { version = "=0.15.1", default-features = false, features = ["arrow-59"] }
erebor-interceptor-abi = { path = "../erebor-interceptor-abi" }
tempfile = "3.23.0"
tokio.workspace = true

[[example]]
name = "storage_poc"
path = "examples/storage_poc/main.rs"
required-features = ["store"]

[lints]
workspace = true
