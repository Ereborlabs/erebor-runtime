[package]
name = "araphor-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
native-store = ["dep:fjall", "dep:arrow-ipc", "dep:rmp-serde", "dep:serde"]

[dependencies]
arrow-array = "=59.2.0"
arrow-schema = "=59.2.0"
arrow-select = "=59.2.0"
arrow-cast = "=59.2.0"
erebor-runtime-error = { path = "../erebor-runtime-error" }
snafu.workspace = true
fjall = { path = "../../fjall", version = "=3.1.13", features = ["journal-cdc"], optional = true }
arrow-ipc = { version = "=59.2.0", optional = true }
rmp-serde = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
