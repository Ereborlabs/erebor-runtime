[package]
name = "araphor-neon-storage-poc"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[features]
default = ["neon-poc", "cdc-poc"]
neon-poc = []
cdc-poc = []

[[bin]]
name = "storage_poc"
path = "../main.rs"

[dependencies]
araphor-graph = { path = "../../..", features = ["store"] }
araphor-analysis-builtins = { path = "../../../../araphor-analysis-builtins" }
araphor-analysis-sdk = { path = "../../../../araphor-analysis-sdk" }
araphor-analysis-types = { path = "../../../../araphor-analysis-types" }
erebor-interceptor-abi = { path = "../../../../erebor-interceptor-abi" }
arrow-array = "=59.2.0"
arrow-schema = "=59.2.0"
arrow-select = "=59.2.0"
arrow-ipc = "=59.2.0"
crc32c = "0.6.8"
duckdb = { version = "=1.10505.0", default-features = false, features = ["bundled", "appender-arrow"] }
fjall = { path = "../../../../../fjall", features = ["journal-cdc"] }
redb = "=4.4.0"
surrealkv = "=1.2.0"
log = "=0.4.29"
rmp-serde = "1.3.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_bytes = "=0.11.19"
serde_arrow = { version = "=0.15.1", default-features = false, features = ["arrow-59"] }
tempfile = "3.23.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "net", "sync", "macros"] }
tokio-util = "0.7"
bytes = "1"
camino = "1"
pageserver = { path = "../../../../../neon/pageserver", features = ["benchmarking"] }
pageserver_api = { path = "../../../../../neon/libs/pageserver_api" }
neon-utils = { package = "utils", path = "../../../../../neon/libs/utils" }
wal_decoder = { path = "../../../../../neon/libs/wal_decoder" }

[patch.crates-io]
duckdb = { path = "../../../../../vendor/duckdb" }
libduckdb-sys = { path = "../../../../../vendor/libduckdb-sys" }
tokio-postgres = { git = "https://github.com/neondatabase/rust-postgres.git", branch = "neon" }
