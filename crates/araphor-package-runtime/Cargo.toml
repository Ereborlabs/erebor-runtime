[package]
name = "araphor-package-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-fixtures = ["dep:araphor-analysis-builtins"]

[dependencies]
araphor-analysis-builtins = { path = "../araphor-analysis-builtins", optional = true }
araphor-analysis-sdk = { path = "../araphor-analysis-sdk", features = ["native"] }
araphor-data = { path = "../araphor-data" }
araphor-package = { path = "../araphor-package" }
erebor-runtime-error = { path = "../erebor-runtime-error" }
libloading = "=0.9.0"
object = { version = "=0.40.0", default-features = false, features = ["read", "std"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde.workspace = true
sha2.workspace = true
snafu.workspace = true
tempfile = "3.23.0"
tokio.workspace = true
tokio-util = { version = "0.7.19", features = ["rt"] }
wasmtime = { version = "=49.0.2", default-features = false, features = ["component-model", "runtime", "cranelift", "std", "parallel-compilation"] }
wasmparser = "=0.258.3"

[dev-dependencies]
araphor-analysis-builtins = { path = "../araphor-analysis-builtins" }
futures-util.workspace = true
serde_json.workspace = true
wat = "=1.258.3"

[lints]
workspace = true
