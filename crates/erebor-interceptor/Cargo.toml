[package]
name = "erebor-interceptor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
erebor-interceptor-abi = { path = "../erebor-interceptor-abi" }
erebor-runtime-error = { path = "../erebor-runtime-error" }
libbpf-rs.workspace = true
serde.workspace = true
sha2.workspace = true
snafu.workspace = true
zerocopy.workspace = true
rustix = { version = "1.1.4", features = ["fs"] }

[build-dependencies]
libbpf-cargo.workspace = true
# libbpf-cargo has no vendored feature of its own; this unifies its host-side
# libbpf-rs dependency with the fully vendored libelf/zlib configuration.
libbpf-rs.workspace = true

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
