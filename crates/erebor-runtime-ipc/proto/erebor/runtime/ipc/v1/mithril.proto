syntax = "proto3";

package erebor.runtime.ipc.v1;

service RuntimeObservationService {
  rpc GetSnapshot(MithrilObservationSnapshotRequest) returns (MithrilObservationSnapshotResponse);
}

message MithrilObservationSnapshotRequest {
  string cgroup_scope = 1;
}

message MithrilObservationSnapshotResponse {
  bool accepted = 1;
  string reason = 2;
  MithrilObservationSnapshot snapshot = 3;
}

message MithrilObservationSnapshot {
  string cgroup_scope = 1;
  string node_boot_id = 2;
  uint64 label_epoch = 3;
  string program_digest = 4;
  bool kernel_ready = 5;
  repeated MithrilCapabilityRecord capabilities = 6;
  repeated MithrilEffectObservation recent_effects = 7;
  uint64 attempted_effects = 8;
  uint64 emitted_effects = 9;
  uint64 lost_effects = 10;
  uint64 unresolved_effects = 11;
  uint64 decoder_errors = 12;
  bool effect_health_available = 13;
  repeated MithrilCoverageInterval coverage_intervals = 14;
  bool negative_claim_eligible = 15;
  uint64 evidence_errors = 16;
}

message MithrilCoverageInterval {
  string interval_id = 1;
  string source_id = 2;
  uint64 source_epoch = 3;
  uint32 cpu_id = 4;
  uint64 revision = 5;
  string state = 6;
  uint64 first_sequence = 7;
  optional uint64 last_sequence = 8;
  repeated string gap_reasons = 9;
  uint64 attempted = 10;
  uint64 suppressed = 11;
  uint64 requested = 12;
  uint64 emitted = 13;
  uint64 lost = 14;
  uint64 classifier_miss_count = 15;
  uint64 unresolved = 16;
  uint64 next_sequence = 17;
  bool negative_claim_eligible = 18;
}

message MithrilCapabilityRecord {
  string capability_id = 1;
  string state = 2;
  string reason_code = 3;
}

message MithrilEffectObservation {
  uint64 observed_boottime_ns = 1;
  uint64 task_cookie = 2;
  uint64 profile_generation_ref_id = 3;
  string process_lineage_id = 4;
  string process_instance_id = 5;
  string entry_instance_id = 6;
  string authority_domain_id = 7;
  string binding_id = 8;
  string execution_set_id = 9;
  uint32 mount_namespace_inode = 10;
  uint64 mount_id_unique = 11;
  uint32 filesystem_device = 12;
  uint64 inode = 13;
  uint64 inode_generation = 14;
  uint64 exact_object_key_id = 15;
  uint64 composite_atom_id = 16;
  uint32 active_role_id = 17;
  uint32 process_state_vector_id = 18;
  reserved 19;
  uint32 effect_family = 20;
  uint32 operation = 21;
  sint32 configured_errno = 22;
  sint32 kernel_result = 23;
  uint32 reason_code = 24;
  string reason = 25;
  uint32 physical_result_code = 26;
  string physical_result = 27;
  string stage = 28;
  string controller_process_state_id = 29;
  uint64 controller_transition_version = 30;
  uint64 target_task_cookie = 31;
  uint64 target_profile_generation_ref_id = 32;
  string target_process_state_id = 33;
  uint64 target_transition_version = 34;
  uint32 target_role_id = 35;
  uint32 target_process_state_vector_id = 36;
  uint32 operation_argument = 37;
  string io_uring_ring_id = 38;
  uint64 io_uring_ring_generation = 39;
  uint64 io_uring_submission_sequence = 40;
  uint64 io_uring_user_data = 41;
  sint64 io_uring_file_offset = 42;
  uint64 io_uring_buffer_address = 43;
  uint64 io_uring_file_cookie = 44;
  uint64 io_uring_executor_pid_tgid = 45;
  uint32 io_uring_byte_length = 46;
  uint32 io_uring_sqe_index = 47;
  uint32 io_uring_request_flags = 48;
  uint32 io_uring_rw_flags = 49;
  uint32 io_uring_opcode = 50;
  uint64 network_socket_key_id = 51;
  uint64 network_socket_generation = 52;
  uint64 network_flow_generation = 53;
  uint64 network_destination_policy_handle = 54;
  uint64 network_namespace_address = 55;
  uint32 network_namespace_inode = 56;
  uint64 network_creator_profile_generation_ref_id = 57;
  bytes network_peer_address = 58;
  uint32 network_peer_port = 59;
  uint32 network_address_family = 60;
  uint32 network_protocol = 61;
  uint32 network_socket_state = 62;
  uint32 network_response_scope = 63;
  string network_flow_authorization_id = 64;
  uint64 network_creator_destination_policy_handle = 65;
  uint64 network_flow_authorizer_profile_generation_ref_id = 66;
  uint64 network_parent_socket_key_id = 67;
  uint64 network_parent_socket_generation = 68;
  uint64 network_current_namespace_address = 69;
  uint32 network_current_namespace_inode = 70;
  uint64 source_sequence = 71;
  uint32 source_cpu_id = 72;
  uint32 admitted_entry_rule_id = 73;
}
