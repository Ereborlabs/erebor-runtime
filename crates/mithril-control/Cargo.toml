[package]
name = "mithril-control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
test-fixtures = []

[dependencies]
axum.workspace = true
axum-server.workspace = true
clap.workspace = true
crossterm.workspace = true
crc32c.workspace = true
ed25519-dalek.workspace = true
erebor-interceptor-abi = { path = "../erebor-interceptor-abi" }
erebor-runtime-error = { path = "../erebor-runtime-error" }
erebor-telemetry = { path = "../erebor-telemetry" }
hex.workspace = true
k8s-openapi.workspace = true
kube = { workspace = true, features = ["derive"] }
json-patch.workspace = true
minicbor.workspace = true
openidconnect.workspace = true
prost.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
reqwest.workspace = true
rustix = { version = "1.1.4", features = ["fs"] }
schemars.workspace = true
secrecy.workspace = true
snafu.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
uuid.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
prost-types.workspace = true
rcgen = "0.13.2"
tempfile = "3.23.0"
tower.workspace = true

[[bin]]
name = "mithril-control"
path = "src/main.rs"

[[bin]]
name = "mithril-policy"
path = "src/bin/mithril_policy.rs"

[[bin]]
name = "kubectl-mithril"
path = "src/bin/kubectl_mithril.rs"

[lints]
workspace = true
