syntax = "proto3";

package erebor.mithril.control.v1;

service NodeControl {
  rpc OpenStream(stream NodeEnvelope) returns (stream ControlEnvelope);
}

message NodeEnvelope {
  uint32 protocol_version = 1;
  string node_id = 2;
  bytes node_boot_id = 3;
  bytes connection_nonce = 4;
  uint64 sequence = 5;
  oneof payload {
    NodeRegistration registration = 10;
    NodeReadinessReport readiness_report = 11;
    TrustGenerationAck trust_ack = 12;
    AdministrativeExecResolution resolution = 13;
    AdministrativeExecArmResult arm_result = 14;
    EvidenceBatch evidence_batch = 15;
    CoverageReport coverage_report = 16;
  }
}

message CapabilityRecord {
  string capability_id = 1;
  string state = 2;
  string reason_code = 3;
}

message NodeRegistration {
  string platform_digest = 1;
  string program_digest = 2;
  uint64 label_epoch = 3;
  bool kernel_ready = 6;
  bool effect_prevention_claims_enabled = 7;
  repeated CapabilityRecord capabilities = 8;
}

message TrustGenerationAck {
  uint64 generation = 1;
  string bundle_digest = 2;
}

message NodeReadinessReport {
  bool kernel_ready = 1;
  bool control_ready = 2;
  bool admission_ready = 3;
}

message ControlEnvelope {
  uint32 protocol_version = 1;
  string node_id = 2;
  bytes node_boot_id = 3;
  bytes connection_nonce = 4;
  uint64 sequence = 5;
  oneof payload {
    RegistrationAccepted registration_accepted = 10;
    TrustGeneration trust_generation = 11;
    ResolveAdministrativeExec resolve_administrative_exec = 12;
    ArmAdministrativeExec arm_administrative_exec = 13;
    EvidenceAck evidence_ack = 14;
    CoverageAck coverage_ack = 15;
  }
}

message EvidenceRecord {
  uint64 cursor = 1;
  bytes observation_id = 2;
  bytes payload = 3;
  bytes payload_sha256 = 4;
  bytes previous_record_sha256 = 5;
  bytes record_sha256 = 6;
}

message EvidenceBatch {
  uint64 first_cursor = 1;
  uint64 last_cursor = 2;
  repeated EvidenceRecord records = 3;
  bytes batch_sha256 = 4;
}

message EvidenceAck {
  uint64 first_cursor = 1;
  uint64 last_cursor = 2;
  bytes batch_sha256 = 3;
}

message CoverageCounters {
  uint64 attempted = 1;
  uint64 suppressed = 2;
  uint64 requested = 3;
  uint64 emitted = 4;
  uint64 lost = 5;
  uint64 classifier_miss_count = 6;
  uint64 unresolved = 7;
  uint64 next_sequence = 8;
}

message CoverageInterval {
  bytes interval_id = 1;
  bytes source_id = 2;
  uint64 source_epoch = 3;
  uint32 cpu_id = 4;
  uint64 revision = 5;
  string state = 6;
  uint64 first_sequence = 7;
  optional uint64 last_sequence = 8;
  CoverageCounters opening_counters = 9;
  optional CoverageCounters closing_counters = 10;
  repeated string gap_reasons = 11;
  bool current = 12;
}

message CoverageReport {
  uint64 source_epoch = 1;
  uint64 revision = 2;
  repeated CoverageInterval intervals = 3;
  bool negative_claim_eligible = 4;
  bytes report_sha256 = 5;
}

message CoverageAck {
  uint64 source_epoch = 1;
  uint64 revision = 2;
  bytes report_sha256 = 3;
}

message ResolveAdministrativeExec {
  bytes request_id = 1;
  bytes namespace = 2;
  bytes pod_uid = 3;
  bytes container_name = 4;
  bytes full_container_id = 5;
  uint64 container_generation = 6;
  repeated bytes argv = 7;
  uint32 stream_flags = 8;
  string approved_role_id = 9;
}

message AdministrativeExecResolution {
  bytes request_id = 1;
  bool resolved = 2;
  string reason_code = 3;
  bytes target_node_id = 4;
  bytes namespace = 5;
  bytes pod_uid = 6;
  bytes container_name = 7;
  bytes full_container_id = 8;
  uint64 container_generation = 9;
  repeated bytes argv = 10;
  uint32 stream_flags = 11;
  string approved_role_id = 12;
  bytes profile_id = 13;
  uint64 profile_owner_generation = 14;
  bytes profile_artifact_sha256 = 15;
  ResolvedAdministrativeExecutable resolved_executable = 16;
}

message ResolvedAdministrativeExecutable {
  bytes requested_name = 1;
  uint32 resolution_mode = 2;
  bytes resolved_display_path = 3;
  bytes container_working_directory = 4;
  repeated bytes effective_path_entries = 5;
  bytes target_mount_namespace_id = 6;
  uint64 target_mount_topology_generation = 7;
  AdministrativeFileObject executable_object = 8;
}

message AdministrativeFileObject {
  bytes mount_namespace_id = 1;
  uint64 mount_topology_generation = 2;
  uint32 mount_id = 3;
  bytes filesystem_instance_id = 4;
  uint64 inode = 5;
  uint32 inode_generation = 6;
  bytes exact_live_object_id = 7;
  uint32 object_kind = 8;
  bytes backing_identity = 9;
  bytes live_interval_id = 10;
}

message ArmAdministrativeExec {
  bytes request_id = 1;
  bytes signed_intent = 2;
  bytes body_sha256 = 3;
}

message AdministrativeExecArmResult {
  bytes request_id = 1;
  bool armed = 2;
  string reason_code = 3;
  bytes proof_id = 4;
  bytes claim_slot_id = 5;
}

message RegistrationAccepted {}

message TrustGeneration {
  uint64 generation = 1;
  string bundle_digest = 2;
}
