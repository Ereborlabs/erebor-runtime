syntax = "proto3";

package erebor.mithril.control.v1;

service NodeRegistry {
  rpc Register(NodeRegistrationRequest) returns (RegistrationAccepted);
  rpc ReportReadiness(NodeReadinessRequest) returns (RegistrationAccepted);
}

service NodeTrust {
  rpc Watch(NodeSessionContext) returns (stream TrustGeneration);
  rpc Acknowledge(TrustGenerationAckRequest) returns (RegistrationAccepted);
}

service NodeEvidence {
  rpc Upload(EvidenceBatchRequest) returns (EvidenceAck);
}

service NodeCoverage {
  rpc Report(CoverageReportRequest) returns (CoverageAck);
}

// Delivers immutable node candidates only after current trust acknowledgement.
service NodePolicy {
  rpc Inventory(PolicyInventoryRequest) returns (PolicyInventory);
  rpc Fetch(PolicyChunkRequest) returns (PolicyChunk);
  rpc Acknowledge(PolicyAcknowledgementRequest) returns (PolicyAcknowledgementAccepted);
  rpc InventoryExceptions(ExceptionInventoryRequest) returns (ExceptionInventory);
  rpc AcknowledgeException(ExceptionAcknowledgementRequest) returns (PolicyAcknowledgementAccepted);
}

// Exposes bounded counters and booleans without policy or evidence payloads.
service ControlHealth {
  rpc Get(NodeSessionContext) returns (ControlConvergenceHealth);
}

service NodeAdministrativeResolution {
  rpc Open(stream AdministrativeExecResolutionStreamRequest) returns (stream ResolveAdministrativeExec);
}

service NodeAdministrativeArm {
  rpc Open(stream AdministrativeExecArmStreamRequest) returns (stream ArmAdministrativeExec);
}

// Binds every RPC to one node boot and one connection nonce.
message NodeSessionContext {
  string node_id = 1;
  bytes node_boot_id = 2;
  bytes connection_nonce = 3;
}

message NodeRegistrationRequest {
  NodeSessionContext session = 1;
  NodeRegistration registration = 2;
}

message NodeReadinessRequest {
  NodeSessionContext session = 1;
  NodeReadinessReport report = 2;
}

message TrustGenerationAckRequest {
  NodeSessionContext session = 1;
  TrustGenerationAck acknowledgement = 2;
}

message EvidenceBatchRequest {
  NodeSessionContext session = 1;
  EvidenceBatch batch = 2;
}

message CoverageReportRequest {
  NodeSessionContext session = 1;
  CoverageReport report = 2;
}

message PolicyInventoryRequest {
  NodeSessionContext session = 1;
  string active_candidate_content_id = 2;
  repeated string durable_bundle_digests = 3;
}

message PolicyChunkRequest {
  NodeSessionContext session = 1;
  string candidate_content_id = 2;
  string bundle_digest = 3;
  uint32 chunk_index = 4;
}

message PolicyAcknowledgementRequest {
  NodeSessionContext session = 1;
  PolicyActivationAcknowledgement acknowledgement = 2;
}

message ExceptionInventoryRequest {
  NodeSessionContext session = 1;
  repeated string durable_candidate_content_ids = 2;
}

message ExceptionAcknowledgementRequest {
  NodeSessionContext session = 1;
  ExceptionActivationAcknowledgement acknowledgement = 2;
}

message AdministrativeExecResolutionStreamRequest {
  NodeSessionContext session = 1;
  AdministrativeExecResolution result = 2;
}

message AdministrativeExecArmStreamRequest {
  NodeSessionContext session = 1;
  AdministrativeExecArmResult result = 2;
}

message CapabilityRecord {
  string capability_id = 1;
  string state = 2;
  string reason_code = 3;
}

// Reports node-local facts. Kubernetes scheduling facts come from Control inventory.
message NodeRegistration {
  string platform_digest = 1;
  string program_digest = 2;
  uint64 label_epoch = 3;
  bool kernel_ready = 6;
  bool effect_prevention_claims_enabled = 7;
  repeated CapabilityRecord capabilities = 8;
  repeated RegisteredWorkloadTarget workload_targets = 9;
  string kubernetes_node_name = 10;
}

// Reports static non-Kubernetes workload facts from a registered node.
message RegisteredWorkloadTarget {
  string workload_binding_generation_digest = 1;
  string execution_set_id = 2;
  string cluster_uid = 3;
  string namespace_uid = 4;
  string controller_uid = 5;
  string service_account_uid = 6;
  string pod_uid = 7;
  string container_id = 8;
  string container_name = 9;
  string container_kind = 10;
  string image_digest = 11;
  map<string, string> pod_labels = 12;
}

message TrustGenerationAck {
  uint64 generation = 1;
  string bundle_digest = 2;
}

message NodeReadinessReport {
  bool kernel_ready = 1;
  bool control_ready = 2;
  bool admission_ready = 3;
}

message EvidenceRecord {
  uint64 cursor = 1;
  bytes observation_id = 2;
  bytes payload = 3;
  bytes payload_sha256 = 4;
  bytes previous_record_sha256 = 5;
  bytes record_sha256 = 6;
}

message EvidenceBatch {
  uint64 first_cursor = 1;
  uint64 last_cursor = 2;
  repeated EvidenceRecord records = 3;
  bytes batch_sha256 = 4;
}

// Acknowledges only a complete range that Control committed contiguously.
message EvidenceAck {
  uint64 first_cursor = 1;
  uint64 last_cursor = 2;
  bytes batch_sha256 = 3;
}

message CoverageCounters {
  uint64 attempted = 1;
  uint64 suppressed = 2;
  uint64 requested = 3;
  uint64 emitted = 4;
  uint64 lost = 5;
  uint64 classifier_miss_count = 6;
  uint64 unresolved = 7;
  uint64 next_sequence = 8;
}

message CoverageInterval {
  bytes interval_id = 1;
  bytes source_id = 2;
  uint64 source_epoch = 3;
  uint32 cpu_id = 4;
  uint64 revision = 5;
  string state = 6;
  uint64 first_sequence = 7;
  optional uint64 last_sequence = 8;
  CoverageCounters opening_counters = 9;
  optional CoverageCounters closing_counters = 10;
  repeated string gap_reasons = 11;
  bool current = 12;
}

message CoverageReport {
  uint64 source_epoch = 1;
  uint64 revision = 2;
  repeated CoverageInterval intervals = 3;
  bool negative_claim_eligible = 4;
  bytes report_sha256 = 5;
}

message CoverageAck {
  uint64 source_epoch = 1;
  uint64 revision = 2;
  bytes report_sha256 = 3;
}

// Describes a candidate before the node requests bounded chunks.
message PolicyInventory {
  bool candidate_available = 1;
  string candidate_content_id = 2;
  string policy_source_revision_id = 3;
  string target_snapshot_digest = 4;
  string bundle_digest = 5;
  uint64 bundle_bytes = 6;
  uint32 chunk_count = 7;
  string operation = 8;
}

// Carries one content-addressed part of the complete policy bundle.
message PolicyChunk {
  string candidate_content_id = 1;
  string bundle_digest = 2;
  uint32 chunk_index = 3;
  uint32 chunk_count = 4;
  string chunk_sha256 = 5;
  bytes payload = 6;
}

// Reports node-local activation proof. Control adds authenticated session identity.
message PolicyActivationAcknowledgement {
  string tenant_id = 1;
  string candidate_content_id = 2;
  string policy_source_revision_id = 3;
  string target_snapshot_digest = 4;
  string state = 5;
  string node_bound_generation_digest = 6;
  uint64 profile_generation_ref_id = 7;
  string readback_digest = 8;
  string probe_result_digest = 9;
  string reason_code = 10;
  int64 observed_utc_ns = 11;
}

// Confirms the durable Control transition that accepted the node result.
message PolicyAcknowledgementAccepted {
  uint64 control_commit_index = 1;
  string rollout_state = 2;
}

// Carries one signed candidate whose exact target names the authenticated node.
message ExceptionInventory {
  bool candidate_available = 1;
  string candidate_content_id = 2;
  string operation = 3;
  bytes candidate_json = 4;
}

// Reports runtime state without allowing the node to redefine the signed bounds.
message ExceptionActivationAcknowledgement {
  string tenant_id = 1;
  string candidate_content_id = 2;
  string exception_source_revision_id = 3;
  string state = 4;
  uint32 consumed_uses = 5;
  uint64 transition_version = 6;
  string reason_code = 7;
  int64 observed_utc_ns = 8;
}

message ControlConvergenceHealth {
  bool queue_healthy = 1;
  uint64 reconcile_in_flight = 2;
  uint64 reconcile_queue_limit = 3;
  bool storage_healthy = 4;
  uint64 control_commit_index = 5;
  bool watch_healthy = 6;
  uint64 configured_watches = 7;
  uint64 connected_watches = 8;
  uint64 successful_relists = 9;
  uint64 failed_relists = 10;
  uint64 watch_failures = 11;
  uint64 successful_reconciles = 12;
  uint64 rejected_reconciles = 13;
  uint64 successful_compiles = 14;
  uint64 failed_compiles = 15;
  uint64 target_snapshots = 16;
  uint64 rollout_targets = 17;
  uint64 unsettled_rollout_targets = 18;
  uint64 allowed_nodes = 19;
  uint64 connected_nodes = 20;
  uint64 ready_nodes = 21;
  uint64 evidence_cursors = 22;
  uint64 pending_evidence_batches = 23;
  uint64 pending_evidence_records = 24;
  uint64 coverage_cursors = 25;
  uint64 exception_candidates = 26;
  uint64 unsettled_exception_candidates = 27;
}

message ResolveAdministrativeExec {
  bytes request_id = 1;
  bytes namespace = 2;
  bytes pod_uid = 3;
  bytes container_name = 4;
  bytes full_container_id = 5;
  uint64 container_generation = 6;
  repeated bytes argv = 7;
  uint32 stream_flags = 8;
  string approved_role_id = 9;
}

message AdministrativeExecResolution {
  bytes request_id = 1;
  bool resolved = 2;
  string reason_code = 3;
  bytes target_node_id = 4;
  bytes namespace = 5;
  bytes pod_uid = 6;
  bytes container_name = 7;
  bytes full_container_id = 8;
  uint64 container_generation = 9;
  repeated bytes argv = 10;
  uint32 stream_flags = 11;
  string approved_role_id = 12;
  bytes profile_id = 13;
  uint64 profile_owner_generation = 14;
  bytes profile_artifact_sha256 = 15;
  ResolvedAdministrativeExecutable resolved_executable = 16;
}

message ResolvedAdministrativeExecutable {
  bytes requested_name = 1;
  uint32 resolution_mode = 2;
  bytes resolved_display_path = 3;
  bytes container_working_directory = 4;
  repeated bytes effective_path_entries = 5;
  bytes target_mount_namespace_id = 6;
  uint64 target_mount_topology_generation = 7;
  AdministrativeFileObject executable_object = 8;
}

message AdministrativeFileObject {
  bytes mount_namespace_id = 1;
  uint64 mount_topology_generation = 2;
  uint32 mount_id = 3;
  bytes filesystem_instance_id = 4;
  uint64 inode = 5;
  uint32 inode_generation = 6;
  bytes exact_live_object_id = 7;
  uint32 object_kind = 8;
  bytes backing_identity = 9;
  bytes live_interval_id = 10;
}

message ArmAdministrativeExec {
  bytes request_id = 1;
  bytes signed_intent = 2;
  bytes body_sha256 = 3;
}

message AdministrativeExecArmResult {
  bytes request_id = 1;
  bool armed = 2;
  string reason_code = 3;
  bytes proof_id = 4;
  bytes claim_slot_id = 5;
}

message RegistrationAccepted {}

message TrustGeneration {
  uint64 generation = 1;
  string bundle_digest = 2;
  uint64 policy_issuer_sequence_epoch = 3;
  repeated PolicySignerTrust policy_signers = 4;
}

message PolicySignerTrust {
  string signing_key_id = 1;
  bytes ed25519_public_key = 2;
  bool revoked = 3;
}
