podSelector:
  matchLabels:
    app.kubernetes.io/name: direct-runc
  matchExpressions: []
mode: Protect
containers:
  - names: [direct-runc]
    kinds: [Application]
    images:
      - registry.example/direct-runc@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    applicationEntry:
      executionRule: application-entry
      role: application
    additionalEntries:
      - name: poststart
        kind: PostStart
        executionRule: poststart-entry
        role: poststart
      - name: prestop
        kind: PreStop
        executionRule: prestop-entry
        role: prestop
      - name: startup
        kind: StartupProbe
        executionRule: startup-entry
        role: startup
      - name: readiness
        kind: ReadinessProbe
        executionRule: readiness-entry
        role: readiness
      - name: liveness
        kind: LivenessProbe
        executionRule: liveness-entry
        role: liveness
      - name: termination-failure
        kind: PreStop
        executionRule: termination-failure-entry
        role: termination-failure
    administrativeEntry:
      role: administrator
    externalRole: runtime-external
roles:
  - name: application
    files:
      - name: deny-application-file
        path: /var/lib/mithril-convergence/protected.exception-target
        recursive: false
        operations: [OpenRead]
        action: Deny
    pathTreeDenials:
      - name: deny-home-secret-tree
        path: /home/secret
        operations: [OpenRead]
      - name: deny-user-secret-trees
        path: /home/*/secrets
        operations: [OpenRead]
      - name: deny-nested-secret-trees
        path: /srv/**/secrets
        operations: [OpenRead]
    execution:
      - name: application-entry
        path: /bin/sh
        recursive: false
        operations: [Execute]
        action: Allow
    capabilities:
      - name: allow-sys-admin
        capabilities: [SysAdmin]
        action: Allow
    network:
      socketControls: []
      destinations: []
    processControl: []
    unixStreams: []
  - name: poststart
    files:
      - name: deny-poststart-file
        path: /var/lib/mithril-convergence/poststart.denied
        recursive: false
        operations: [OpenRead]
        action: Deny
    execution:
      - name: poststart-entry
        path: /bin/cp
        recursive: false
        operations: [Execute]
        action: Allow
    network:
      socketControls: []
      destinations: []
    processControl: []
    unixStreams: []
  - name: prestop
    files:
      - name: deny-prestop-file
        path: /var/lib/mithril-convergence/prestop.denied
        recursive: false
        operations: [OpenRead]
        action: Deny
    execution:
      - name: prestop-entry
        path: /bin/dd
        recursive: false
        operations: [Execute]
        action: Allow
    network:
      socketControls: []
      destinations: []
    processControl: []
    unixStreams: []
  - name: startup
    files:
      - name: deny-startup-file
        path: /var/lib/mithril-convergence/startup.denied
        recursive: false
        operations: [OpenRead]
        action: Deny
    execution:
      - name: startup-entry
        path: /bin/cat
        recursive: false
        operations: [Execute]
        action: Allow
    network:
      socketControls: []
      destinations: []
    processControl: []
    unixStreams: []
  - name: readiness
    files:
      - name: deny-readiness-file
        path: /var/lib/mithril-convergence/readiness.denied
        recursive: false
        operations: [OpenRead]
        action: Deny
    execution:
      - name: readiness-entry
        path: /bin/grep
        recursive: false
        operations: [Execute]
        action: Allow
    network:
      socketControls: []
      destinations: []
    processControl: []
    unixStreams: []
  - name: liveness
    files:
      - name: deny-liveness-file
        path: /var/lib/mithril-convergence/liveness.denied
        recursive: false
        operations: [OpenRead]
        action: Deny
    execution:
      - name: liveness-entry
        path: /bin/wc
        recursive: false
        operations: [Execute]
        action: Allow
    network:
      socketControls: []
      destinations: []
    processControl: []
    unixStreams: []
  - name: termination-failure
    files: []
    execution:
      - name: termination-failure-entry
        path: /bin/post-ponr-execfail
        recursive: false
        operations: [Execute]
        action: Allow
    network:
      socketControls: []
      destinations: []
    processControl: []
    unixStreams: []
  - name: administrator
    files: []
    execution: []
    network:
      socketControls: []
      destinations: []
    processControl: []
    unixStreams: []
  - name: runtime-external
    files:
      - name: allow-approved-exec-read
        path: /var/lib/mithril/busybox
        recursive: false
        operations: [OpenRead]
        action: Allow
    execution: []
    network:
      socketControls: []
      destinations: []
    processControl: []
    unixStreams: []
exceptionGrants: []
