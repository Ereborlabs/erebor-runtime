apiVersion: v1
kind: Pod
metadata:
  name: incomplete-argv-probe
  namespace: MITHRIL_CONVERGENCE_NAMESPACE
  labels:
    app.kubernetes.io/name: converter
spec:
  serviceAccountName: converter
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: converter
      image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      imagePullPolicy: IfNotPresent
      securityContext:
        appArmorProfile:
          type: Unconfined
      command: [/bin/sh, -ec, "sleep 600"]
      startupProbe:
        exec:
          command: [/bin/cat]
        periodSeconds: 1
        timeoutSeconds: 5
        failureThreshold: 120
