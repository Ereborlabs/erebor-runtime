apiVersion: mithril.erebor.dev/v1alpha1
kind: WorkloadProtectionPolicy
metadata:
  name: converter-policy
  namespace: MITHRIL_CONVERGENCE_NAMESPACE
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: converter
    matchExpressions: []
  mode: Protect
  containers:
    - names: [converter]
      kinds: [Application]
      images:
        - docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      initialRole: worker
      externalRole: runtime-external
  roles:
    - name: worker
      files:
        - name: allow-busybox-read
          path: /bin/busybox
          recursive: false
          operations: [OpenRead, Read, MmapRead]
          action: Allow
        - name: allow-shell-read
          path: /bin/sh
          recursive: false
          operations: [OpenRead, Read, MmapRead]
          action: Allow
        - name: allow-sleep-read
          path: /bin/sleep
          recursive: false
          operations: [OpenRead, Read, MmapRead]
          action: Allow
        - name: allow-cat-read
          path: /bin/cat
          recursive: false
          operations: [OpenRead, Read, MmapRead]
          action: Allow
        - name: allow-touch-read
          path: /bin/touch
          recursive: false
          operations: [OpenRead, Read, MmapRead]
          action: Allow
        - name: allow-rm-read
          path: /bin/rm
          recursive: false
          operations: [OpenRead, Read, MmapRead]
          action: Allow
        - name: allow-start-marker
          path: /var/lib/mithril-convergence/protected.started
          recursive: false
          operations: [OpenRead, OpenWrite, Read, Write, Create, SetAttributes, Unlink]
          action: Allow
        - name: allow-restart-marker
          path: /var/lib/mithril-convergence/protected.restart
          recursive: false
          operations: [OpenRead, OpenWrite, Read, Write, Create, SetAttributes, Unlink]
          action: Allow
        - name: allow-exception-request-marker
          path: /var/lib/mithril-convergence/protected.exception-request
          recursive: false
          operations: [OpenRead, OpenWrite, Read, Write, Create, SetAttributes, Unlink]
          action: Allow
        - name: allow-exception-result-markers
          path: /var/lib/mithril-convergence/protected.exception-result
          recursive: false
          operations: [OpenRead, OpenWrite, Read, Write, Create, SetAttributes, Unlink]
          action: Allow
        - name: allow-prepared-result-marker
          path: /var/lib/mithril-convergence/protected.prepared-result
          recursive: false
          operations: [OpenRead, OpenWrite, Read, Write, Create, SetAttributes, Unlink]
          action: Allow
        - name: allow-ready-node-start-marker
          path: /var/lib/mithril-convergence/ready-node-only.started
          recursive: false
          operations: [OpenRead, OpenWrite, Read, Write, Create, SetAttributes, Unlink]
          action: Allow
        - name: allow-ready-node-restart-marker
          path: /var/lib/mithril-convergence/ready-node-only.restart
          recursive: false
          operations: [OpenRead, OpenWrite, Read, Write, Create, SetAttributes, Unlink]
          action: Allow
        - name: allow-selector-start-marker
          path: /var/lib/mithril-convergence/selector-derived.started
          recursive: false
          operations: [OpenRead, OpenWrite, Read, Write, Create, SetAttributes, Unlink]
          action: Allow
        - name: allow-selector-restart-marker
          path: /var/lib/mithril-convergence/selector-derived.restart
          recursive: false
          operations: [OpenRead, OpenWrite, Read, Write, Create, SetAttributes, Unlink]
          action: Allow
        - name: deny-exception-target-open
          path: /var/lib/mithril-convergence/protected.exception-target
          recursive: false
          operations: [OpenRead]
          action: Deny
        - name: allow-exception-target-read
          path: /var/lib/mithril-convergence/protected.exception-target
          recursive: false
          operations: [Read]
          action: Allow
      execution:
        - name: allow-busybox-execution
          path: /bin/busybox
          recursive: false
          operations: [Execute, MmapExecute, Mprotect]
          action: Allow
        - name: allow-shell-execution
          path: /bin/sh
          recursive: false
          operations: [Execute, MmapExecute, Mprotect]
          action: Allow
        - name: allow-sleep-execution
          path: /bin/sleep
          recursive: false
          operations: [Execute, MmapExecute, Mprotect]
          action: Allow
        - name: allow-cat-execution
          path: /bin/cat
          recursive: false
          operations: [Execute, MmapExecute, Mprotect]
          action: Allow
        - name: allow-touch-execution
          path: /bin/touch
          recursive: false
          operations: [Execute, MmapExecute, Mprotect]
          action: Allow
        - name: allow-rm-execution
          path: /bin/rm
          recursive: false
          operations: [Execute, MmapExecute, Mprotect]
          action: Allow
      network:
        socketControls: []
        destinations: []
      processControl:
        - name: allow-signal-probe
          targetRole: worker
          operation: Signal
          signals: [0]
          action: Allow
      unixStreams:
        - name: worker-loopback
          peerRoles: [worker]
          action: Allow
    - name: runtime-external
      files: []
      execution: []
      network:
        socketControls: []
        destinations: []
      processControl: []
      unixStreams: []
  exceptionGrants:
    - name: temporary-file-access
      fileRules: [deny-exception-target-open]
      maximumDuration: 5m
      maximumUses: 1
