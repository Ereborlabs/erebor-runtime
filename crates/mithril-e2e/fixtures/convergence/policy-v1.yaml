apiVersion: mithril.erebor.dev/v1alpha1
kind: WorkloadProtectionPolicy
metadata:
  name: converter-policy
  namespace: MITHRIL_CONVERGENCE_NAMESPACE
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: converter
    matchExpressions: []
  mode: Protect
  containers:
    - names: [converter]
      kinds: [Application]
      images:
        - docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      initialRole: worker
      externalRole: runtime-external
  roles:
    - name: worker
      files:
        - name: deny-exception-target-open
          path: /var/lib/mithril-convergence/protected.exception-target
          recursive: false
          operations: [OpenRead]
          action: Deny
      execution:
        - name: allow-busybox-execution
          path: /bin/busybox
          recursive: false
          operations: [Execute]
          action: Allow
        - name: allow-shell-execution
          path: /bin/sh
          recursive: false
          operations: [Execute]
          action: Allow
      network:
        socketControls: []
        destinations: []
      processControl: []
      unixStreams: []
    - name: runtime-external
      files: []
      execution: []
      network:
        socketControls: []
        destinations: []
      processControl: []
      unixStreams: []
  exceptionGrants:
    - name: temporary-file-access
      fileRules: [deny-exception-target-open]
      maximumDuration: 5m
      maximumUses: 1
