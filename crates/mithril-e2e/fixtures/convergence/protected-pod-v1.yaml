apiVersion: v1
kind: Pod
metadata:
  name: MITHRIL_CONVERGENCE_POD
  namespace: MITHRIL_CONVERGENCE_NAMESPACE
  labels:
    app.kubernetes.io/name: converter
spec:
  serviceAccountName: converter
  automountServiceAccountToken: false
  runtimeClassName: MITHRIL_CONVERGENCE_RUNTIME_CLASS
  restartPolicy: Always
  terminationGracePeriodSeconds: 1
  containers:
    - name: converter
      image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
        - >-
          rm -f /var/lib/mithril-convergence/MITHRIL_CONVERGENCE_POD.restart;
          touch /var/lib/mithril-convergence/MITHRIL_CONVERGENCE_POD.started;
          while [ ! -e /var/lib/mithril-convergence/MITHRIL_CONVERGENCE_POD.restart ];
          do sleep 1; done;
          exit 42
      volumeMounts:
        - name: fixture
          mountPath: /var/lib/mithril-convergence
  volumes:
    - name: fixture
      hostPath:
        path: /var/lib/mithril-convergence/markers
        type: Directory
