apiVersion: v1
kind: Namespace
metadata:
  name: MITHRIL_IDENTITY_NAMESPACE
---
apiVersion: v1
kind: Pod
metadata:
  name: mithril-identity
  namespace: MITHRIL_IDENTITY_NAMESPACE
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: runtime
      image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "exec sleep 3600"]
      env:
        - name: PATH
          value: /var/lib/mithril/entry:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      startupProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - 'read identity_pid _ < /proc/self/stat; printf "%s\n" "$identity_pid" > /var/lib/mithril/entry/pid; while [ ! -f /var/lib/mithril/entry/release ]; do sleep 0.1; done'
        timeoutSeconds: 30
        periodSeconds: 1
      volumeMounts:
        - name: entry
          mountPath: /var/lib/mithril/entry
  volumes:
    - name: entry
      hostPath:
        path: MITHRIL_IDENTITY_FIXTURE_ROOT
        type: Directory
