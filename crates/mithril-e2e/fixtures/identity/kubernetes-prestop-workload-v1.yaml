apiVersion: v1
kind: Namespace
metadata:
  name: MITHRIL_IDENTITY_PRESTOP_NAMESPACE
---
apiVersion: v1
kind: Pod
metadata:
  name: mithril-prestop
  namespace: MITHRIL_IDENTITY_PRESTOP_NAMESPACE
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 60
  containers:
    - name: application
      image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "exec sleep 3600"]
      lifecycle:
        preStop:
          exec:
            command:
              - /bin/sh
              - -c
              - 'read identity_pid _ < /proc/self/stat; directory=/var/lib/mithril/prestop; marker="$directory/prestop-$identity_pid.pid"; fifo="$directory/prestop-release-$identity_pid"; printf "%s\n" "$identity_pid" > "$marker"; mkfifo "$fifo"; read -r identity_release < "$fifo"; rm -f "$fifo"'
      volumeMounts:
        - name: prestop
          mountPath: /var/lib/mithril/prestop
  volumes:
    - name: prestop
      hostPath:
        path: MITHRIL_IDENTITY_PRESTOP_FIXTURE_ROOT
        type: Directory
