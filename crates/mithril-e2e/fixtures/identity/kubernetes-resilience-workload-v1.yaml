apiVersion: v1
kind: Namespace
metadata:
  name: MITHRIL_IDENTITY_RESILIENCE_NAMESPACE
---
apiVersion: v1
kind: Pod
metadata:
  name: mithril-resilience
  namespace: MITHRIL_IDENTITY_RESILIENCE_NAMESPACE
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: application
      image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "exec sleep 3600"]
      volumeMounts:
        - name: fixture
          mountPath: /var/lib/mithril/resilience
  volumes:
    - name: fixture
      hostPath:
        path: MITHRIL_IDENTITY_RESILIENCE_FIXTURE_ROOT
        type: Directory
