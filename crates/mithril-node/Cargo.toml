[package]
name = "mithril-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []

[dependencies]
clap.workspace = true
containerd-client.workspace = true
ed25519-dalek.workspace = true
erebor-interceptor = { path = "../erebor-interceptor" }
erebor-interceptor-abi = { path = "../erebor-interceptor-abi" }
erebor-runtime-client = { path = "../erebor-runtime-client" }
erebor-runtime-error = { path = "../erebor-runtime-error" }
erebor-runtime-ipc = { path = "../erebor-runtime-ipc" }
hyper-util.workspace = true
hex.workspace = true
libc = "0.2.186"
k8s-cri.workspace = true
mithril-control = { path = "../mithril-control" }
minicbor.workspace = true
procfs.workspace = true
prost.workspace = true
rustix = { version = "1.1.4", features = ["fs", "process", "time"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
snafu.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower.workspace = true
uuid.workspace = true
zerocopy.workspace = true

[dev-dependencies]
rcgen = "0.13.2"
