apiVersion: mithril.erebor.dev/v1alpha1
kind: WorkloadProtectionPolicy
metadata:
  name: outage-policy
  namespace: MITHRIL_OUTAGE_NAMESPACE
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mithril-outage-worker
    matchExpressions: []
  mode: Protect
  containers:
    - names: [worker]
      kinds: [Application]
      images:
        - docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      applicationEntry:
        executionRule: allow-shell
        role: worker
      additionalEntries: []
      administrativeEntry:
        role: administrator
      externalRole: runtime-external
  roles:
    - name: worker
      files:
        - name: deny-outage-target
          path: /work/secret
          recursive: false
          operations: [OpenRead]
          action: Deny
      execution:
        - name: allow-shell
          path: /bin/sh
          recursive: false
          operations: [Execute]
          action: Allow
      network:
        socketControls: []
        destinations: []
      processControl: []
      unixStreams: []
    - name: administrator
      files: []
      execution: []
      network:
        socketControls: []
        destinations: []
      processControl: []
      unixStreams: []
    - name: runtime-external
      files: []
      execution: []
      network:
        socketControls: []
        destinations: []
      processControl: []
      unixStreams: []
  exceptionGrants: []
