apiVersion: v1
kind: Pod
metadata:
  name: MITHRIL_OUTAGE_POD
  namespace: MITHRIL_OUTAGE_NAMESPACE
  labels:
    app.kubernetes.io/name: mithril-outage-worker
spec:
  serviceAccountName: worker
  automountServiceAccountToken: false
  runtimeClassName: MITHRIL_OUTAGE_RUNTIME_CLASS
  restartPolicy: Always
  terminationGracePeriodSeconds: 1
  nodeSelector:
    qualification.mithril.erebor.dev/node: MITHRIL_OUTAGE_NODE
  containers:
    - name: worker
      image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
        - >-
          printf 'protected\n' > /work/secret;
          while true; do
          if cat /work/secret >/dev/null 2>&1;
          then verdict=ALLOWED; else verdict=DENIED; fi;
          printf '%s %s\n' "$verdict" "$(date +%s)";
          sleep 1;
          done
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      emptyDir: {}
