{{- if and .Values.control.enabled .Values.control.admission.enabled }}
{{- $caBundle := required "control.admission.caBundle is required when admission is enabled" .Values.control.admission.caBundle }}
{{- $bootstrapNamespaces := list .Release.Namespace "kube-system" "kube-public" "kube-node-lease" }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mithril-control-{{ .Release.Namespace }}
webhooks:
  # Node mutation establishes quarantine before the readiness reconciler can remove it.
  - name: nodes.mithril.erebor.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    timeoutSeconds: {{ .Values.control.admission.webhookTimeoutSeconds }}
    clientConfig:
      caBundle: {{ $caBundle | quote }}
      service:
        namespace: {{ .Release.Namespace | quote }}
        name: mithril-control
        path: /admit
        port: {{ .Values.control.admission.port }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["nodes"]
        scope: Cluster
  - name: pods.mithril.erebor.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    timeoutSeconds: {{ .Values.control.admission.webhookTimeoutSeconds }}
    # Control and Kubernetes system Pods must start before fail-closed admission can serve workloads.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
{{ toYaml $bootstrapNamespaces | indent 12 }}
    clientConfig:
      caBundle: {{ $caBundle | quote }}
      service:
        namespace: {{ .Release.Namespace | quote }}
        name: mithril-control
        path: /admit
        port: {{ .Values.control.admission.port }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
---
# Pod updates are validation-only. The webhook does not rewrite scheduled Pods.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: mithril-control-bindings-{{ .Release.Namespace }}
webhooks:
  - name: pod-updates.mithril.erebor.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: {{ .Values.control.admission.webhookTimeoutSeconds }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
{{ toYaml $bootstrapNamespaces | indent 12 }}
    clientConfig:
      caBundle: {{ $caBundle | quote }}
      service:
        namespace: {{ .Release.Namespace | quote }}
        name: mithril-control
        path: /admit
        port: {{ .Values.control.admission.port }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
        scope: Namespaced
  - name: bindings.mithril.erebor.dev
    # Binding validation checks the scheduler's choice; it never chooses a Node.
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: {{ .Values.control.admission.webhookTimeoutSeconds }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
{{ toYaml $bootstrapNamespaces | indent 12 }}
    clientConfig:
      caBundle: {{ $caBundle | quote }}
      service:
        namespace: {{ .Release.Namespace | quote }}
        name: mithril-control
        path: /admit
        port: {{ .Values.control.admission.port }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
        scope: Namespaced
{{- end }}
