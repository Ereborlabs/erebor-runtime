{{- if .Values.control.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mithril-control
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mithril-control-daemonset-reader
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["mithril-node"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mithril-control-daemonset-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mithril-control-daemonset-reader
subjects:
  - kind: ServiceAccount
    name: mithril-control
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mithril-control-{{ .Release.Namespace }}
rules:
  - apiGroups: ["mithril.erebor.dev"]
    resources: ["workloadprotectionpolicies", "workloadprotectionexceptions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["mithril.erebor.dev"]
    resources: ["workloadprotectionpolicies/status", "workloadprotectionexceptions/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["namespaces", "pods", "serviceaccounts"]
    verbs: ["get", "list"]
  # Built-in RBAC cannot restrict a Node patch to the Mithril projection fields.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mithril-control-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mithril-control-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: mithril-control
    namespace: {{ .Release.Namespace | quote }}
---
# Bind these roles only in namespaces where the corresponding operator acts.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mithril-policy-writer
rules:
  - apiGroups: ["mithril.erebor.dev"]
    resources: ["workloadprotectionpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mithril-exception-writer
rules:
  - apiGroups: ["mithril.erebor.dev"]
    resources: ["workloadprotectionexceptions"]
    verbs: ["get", "list", "watch", "create", "delete"]
{{- end }}
