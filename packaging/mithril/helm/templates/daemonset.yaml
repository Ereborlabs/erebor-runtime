{{- $runtimeAdmissionSocket := required "node.runtimeHook.socketPath is required" .Values.node.runtimeHook.socketPath }}
{{- $cleanRuntimeAdmissionSocket := clean $runtimeAdmissionSocket }}
{{- $containerRuntimeSocket := required "node.containerRuntimeSocket is required" .Values.node.containerRuntimeSocket }}
{{- $cleanContainerRuntimeSocket := clean $containerRuntimeSocket }}
{{- $containerRuntimeDirectory := dir $containerRuntimeSocket }}
{{- $runtimeHookOwner := printf "%s/%s" .Release.Namespace .Release.Name }}
{{- $runtimeHookBinaryDirectory := required "node.runtimeHook.hostBinaryDirectory is required" .Values.node.runtimeHook.hostBinaryDirectory }}
{{- $containerdConfigDirectory := required "node.runtimeHook.containerdConfigHostDirectory is required" .Values.node.runtimeHook.containerdConfigHostDirectory }}
{{- $k3sBinaryHostPath := required "node.runtimeHook.k3sBinaryHostPath is required" .Values.node.runtimeHook.k3sBinaryHostPath }}
{{- if or (ne $runtimeAdmissionSocket $cleanRuntimeAdmissionSocket) (ne (dir $runtimeAdmissionSocket) "/run/mithril") }}
{{- fail "node.runtimeHook.socketPath must name a normalized socket directly within /run/mithril" }}
{{- end }}
{{- if or (ne $containerRuntimeSocket $cleanContainerRuntimeSocket) (eq $containerRuntimeDirectory "/") }}
{{- fail "node.containerRuntimeSocket must name a normalized socket below a non-root directory" }}
{{- end }}
{{- if or (ne $runtimeHookBinaryDirectory (clean $runtimeHookBinaryDirectory)) (eq (dir $runtimeHookBinaryDirectory) "/") }}
{{- fail "node.runtimeHook.hostBinaryDirectory must be normalized below a non-root parent" }}
{{- end }}
{{- if or (ne $containerdConfigDirectory (clean $containerdConfigDirectory)) (eq (dir $containerdConfigDirectory) "/") }}
{{- fail "node.runtimeHook.containerdConfigHostDirectory must be normalized below a non-root parent" }}
{{- end }}
{{- if or (ne $k3sBinaryHostPath (clean $k3sBinaryHostPath)) (eq (dir $k3sBinaryHostPath) "/") }}
{{- fail "node.runtimeHook.k3sBinaryHostPath must be normalized below a non-root parent" }}
{{- end }}
{{- if le (mul (int .Values.node.runtimeHook.runtimeTimeoutSeconds) 1000) (int .Values.node.runtimeHook.timeoutMs) }}
{{- fail "node.runtimeHook.runtimeTimeoutSeconds must exceed node.runtimeHook.timeoutMs" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mithril-node
# Nodes have no Kubernetes API authority. Control performs all API operations.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mithril-node
  labels:
    app.kubernetes.io/name: mithril-node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mithril-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mithril-node
      annotations:
        # Each chart upgrade reruns the exact-path hook owner before node startup.
        mithril.erebor.dev/release-revision: {{ .Release.Revision | quote }}
    spec:
      serviceAccountName: mithril-node
      automountServiceAccountToken: false
      hostPID: true
      terminationGracePeriodSeconds: 10
      tolerations:
        # Only mithril-node can start while its eligible Node remains quarantined.
        - key: mithril.erebor.dev/not-ready
          operator: Exists
          effect: NoSchedule
{{- with .Values.node.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.node.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
      # This measured installer is one of the two exact recovery executables.
      initContainers:
        - name: install-runtime-gate
          image: {{ .Values.node.image | quote }}
          imagePullPolicy: {{ .Values.node.imagePullPolicy }}
          command: ["/usr/local/bin/mithril-oci-hook", "install"]
          args:
            - --owner
            - {{ $runtimeHookOwner | quote }}
            - --hook-host-directory
            - {{ $runtimeHookBinaryDirectory | quote }}
            - --containerd-host-directory
            - {{ $containerdConfigDirectory | quote }}
            - --k3s-host-path
            - {{ $k3sBinaryHostPath | quote }}
            - --socket
            - {{ $runtimeAdmissionSocket | quote }}
            - --timeout-ms
            - {{ .Values.node.runtimeHook.timeoutMs | quote }}
            - --runtime-timeout-seconds
            - {{ .Values.node.runtimeHook.runtimeTimeoutSeconds | quote }}
            - --log-filter
            - {{ .Values.node.logFilter | quote }}
{{- range $mount := list
      (printf "%s=/etc/mithril/node.json" $.Values.node.configHostPath)
      (printf "%s=/etc/mithril/identity" $.Values.node.identityHostPath)
      "/sys/kernel/btf=/sys/kernel/btf"
      "/sys/kernel/tracing=/sys/kernel/tracing"
      "/sys/fs/cgroup=/sys/fs/cgroup"
      (printf "%s=%s" $containerRuntimeDirectory $containerRuntimeDirectory) }}
            - --node-read-only-mount
            - {{ $mount | quote }}
{{- end }}
{{- range $mount := list
      "/sys/fs/bpf=/sys/fs/bpf"
      (printf "%s=/var/lib/mithril" $.Values.node.stateHostPath)
      (printf "%s=/run/mithril" $.Values.node.runHostPath)
      "/run/erebor-interceptor=/run/erebor-interceptor" }}
            - --node-read-write-mount
            - {{ $mount | quote }}
{{- end }}
          env:
            - name: RUST_LOG
              value: {{ .Values.node.logFilter | quote }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            privileged: true
          volumeMounts:
            - name: runtime-hook-bin
              mountPath: /host-hook-bin
            - name: containerd-config
              mountPath: /host-containerd
            - name: k3s-binary
              mountPath: /host-k3s
              readOnly: true
      containers:
        - name: mithril-node
          image: {{ .Values.node.image | quote }}
          imagePullPolicy: {{ .Values.node.imagePullPolicy }}
          args: ["--config", "/etc/mithril/node.json"]
          env:
            - name: RUST_LOG
              value: {{ .Values.node.logFilter | quote }}
            # The downward API binds the node session to the scheduler-visible Node name.
            - name: MITHRIL_KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          lifecycle:
            preStop:
              exec:
                # Close the host endpoint before Kubernetes terminates this owner.
                command: ["/bin/rm", "-f", "--", {{ $runtimeAdmissionSocket | quote }}]
          startupProbe:
            exec:
              # Direct argv keeps the configured socket path out of shell interpretation.
              command: ["/usr/bin/test", "-S", {{ $runtimeAdmissionSocket | quote }}]
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            exec:
              command: ["/usr/bin/test", "-S", {{ $runtimeAdmissionSocket | quote }}]
            failureThreshold: 2
            periodSeconds: 5
            timeoutSeconds: 1
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: node-config
              mountPath: /etc/mithril/node.json
              readOnly: true
            - name: node-identity
              mountPath: /etc/mithril/identity
              readOnly: true
            - name: bpf
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            # libbpf reads host tracepoint IDs before it attaches tracepoint programs.
            - name: tracing
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: state
              mountPath: /var/lib/mithril
            - name: run
              mountPath: /run/mithril
            # The host lease prevents two privileged Interceptor owners on one Node.
            - name: interceptor-run
              mountPath: /run/erebor-interceptor
            - name: container-runtime
              # The runtime can replace its socket inode without replacing this Pod.
              mountPath: {{ $containerRuntimeDirectory | quote }}
              readOnly: true
      volumes:
        - name: node-config
          hostPath:
            path: {{ .Values.node.configHostPath | quote }}
            type: File
        - name: node-identity
          hostPath:
            path: {{ .Values.node.identityHostPath | quote }}
            type: Directory
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: tracing
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: state
          hostPath:
            path: {{ .Values.node.stateHostPath | quote }}
            type: DirectoryOrCreate
        - name: run
          hostPath:
            path: {{ .Values.node.runHostPath | quote }}
            type: DirectoryOrCreate
        - name: interceptor-run
          hostPath:
            path: /run/erebor-interceptor
            type: DirectoryOrCreate
        - name: container-runtime
          hostPath:
            path: {{ $containerRuntimeDirectory | quote }}
            type: Directory
        - name: runtime-hook-bin
          hostPath:
            path: {{ $runtimeHookBinaryDirectory | quote }}
            type: DirectoryOrCreate
        - name: containerd-config
          hostPath:
            path: {{ $containerdConfigDirectory | quote }}
            type: Directory
        - name: k3s-binary
          hostPath:
            path: {{ $k3sBinaryHostPath | quote }}
            type: File
