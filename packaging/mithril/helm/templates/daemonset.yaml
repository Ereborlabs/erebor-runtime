{{- $runtimeAdmissionSocket := required "node.runtimeHook.socketPath is required" .Values.node.runtimeHook.socketPath }}
{{- $cleanRuntimeAdmissionSocket := clean $runtimeAdmissionSocket }}
{{- $containerRuntimeSocket := required "node.containerRuntimeSocket is required" .Values.node.containerRuntimeSocket }}
{{- $cleanContainerRuntimeSocket := clean $containerRuntimeSocket }}
{{- $containerRuntimeDirectory := dir $containerRuntimeSocket }}
{{- $runtimeHookOwner := printf "%s/%s" .Release.Namespace .Release.Name }}
{{- $runtimeHookConfigDirectory := required "node.runtimeHook.hostConfigDirectory is required" .Values.node.runtimeHook.hostConfigDirectory }}
{{- $runtimeHookConfigParent := dir $runtimeHookConfigDirectory }}
{{- $runtimeHookConfigBase := base $runtimeHookConfigDirectory }}
{{- $runtimeHookInjectorEnabled := and .Values.node.runtimeHook.install .Values.node.runtimeHook.injector.enabled }}
{{- $legacyRuntimeHookBinaryDirectory := "/opt/mithril/bin" }}
{{- $migrateLegacyRuntimeHook := ne .Values.node.runtimeHook.hostBinaryDirectory $legacyRuntimeHookBinaryDirectory }}
{{- if or (ne $runtimeAdmissionSocket $cleanRuntimeAdmissionSocket) (ne (dir $runtimeAdmissionSocket) "/run/mithril") }}
{{- fail "node.runtimeHook.socketPath must name a normalized socket directly within /run/mithril" }}
{{- end }}
{{- if or (ne $containerRuntimeSocket $cleanContainerRuntimeSocket) (eq $containerRuntimeDirectory "/") }}
{{- fail "node.containerRuntimeSocket must name a normalized socket below a non-root directory" }}
{{- end }}
{{- if or (ne $runtimeHookConfigDirectory (clean $runtimeHookConfigDirectory)) (eq $runtimeHookConfigParent "/") }}
{{- fail "node.runtimeHook.hostConfigDirectory must be normalized below a non-root parent" }}
{{- end }}
{{- if and $runtimeHookInjectorEnabled (not (has $runtimeHookConfigDirectory (list "/etc/containers/oci/hooks.d" "/usr/share/containers/oci/hooks.d" "/usr/libexec/oci/hooks.d"))) }}
{{- fail "the stock runtime-hook injector requires one supported OCI hook directory" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mithril-node
# Nodes have no Kubernetes API authority. Control performs all API operations.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mithril-node
  labels:
    app.kubernetes.io/name: mithril-node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mithril-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mithril-node
      annotations:
        # Each chart upgrade reruns the exact-path hook owner before node startup.
        mithril.erebor.dev/release-revision: {{ .Release.Revision | quote }}
    spec:
      serviceAccountName: mithril-node
      automountServiceAccountToken: false
      hostPID: true
      terminationGracePeriodSeconds: 10
      tolerations:
        # Only mithril-node can start while its eligible Node remains quarantined.
        - key: mithril.erebor.dev/not-ready
          operator: Exists
          effect: NoSchedule
{{- with .Values.node.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.node.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
      # The init container completes hook installation or cleanup before node startup.
      initContainers:
        - name: manage-runtime-hook
          image: {{ .Values.node.image | quote }}
          imagePullPolicy: {{ .Values.node.imagePullPolicy }}
          command: ["/bin/sh", "/hook-source/runtime-hook-owner.sh"]
          args:
{{- if .Values.node.runtimeHook.install }}
            - install
            - {{ $runtimeHookOwner | quote }}
            - /usr/local/bin/mithril-oci-hook
            - /hook-source/98-mithril-runtime-stage.json
            - /hook-source/99-mithril-runtime-admission.json
            - /hook-source/99-mithril-runtime-entry-preparation.json
{{- else }}
            - cleanup
            - {{ $runtimeHookOwner | quote }}
{{- end }}
            - /host-hook-bin
            - {{ printf "/host-hook-config-parent/%s" $runtimeHookConfigBase | quote }}
{{- if $migrateLegacyRuntimeHook }}
            - /host-hook-legacy-bin
{{- end }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime-hook-source
              mountPath: /hook-source
              readOnly: true
            - name: runtime-hook-bin
              mountPath: /host-hook-bin
            - name: runtime-hook-config
              mountPath: /host-hook-config-parent
{{- if $migrateLegacyRuntimeHook }}
            - name: runtime-hook-legacy-bin
              mountPath: /host-hook-legacy-bin
{{- end }}
      containers:
        - name: mithril-node
          image: {{ .Values.node.image | quote }}
          imagePullPolicy: {{ .Values.node.imagePullPolicy }}
          args: ["--config", "/etc/mithril/node.json"]
          env:
            - name: RUST_LOG
              value: {{ .Values.node.logFilter | quote }}
            # The downward API binds the node session to the scheduler-visible Node name.
            - name: MITHRIL_KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          lifecycle:
            preStop:
              exec:
                # Close the host endpoint before Kubernetes terminates this owner.
                command: ["/bin/rm", "-f", "--", {{ $runtimeAdmissionSocket | quote }}]
          startupProbe:
            exec:
              # Direct argv keeps the configured socket path out of shell interpretation.
              command: ["/usr/bin/test", "-S", {{ $runtimeAdmissionSocket | quote }}]
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            exec:
              command: ["/usr/bin/test", "-S", {{ $runtimeAdmissionSocket | quote }}]
            failureThreshold: 2
            periodSeconds: 5
            timeoutSeconds: 1
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: node-config
              mountPath: /etc/mithril/node.json
              readOnly: true
            - name: node-identity
              mountPath: /etc/mithril/identity
              readOnly: true
            - name: bpf
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            # libbpf reads host tracepoint IDs before it attaches tracepoint programs.
            - name: tracing
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: state
              mountPath: /var/lib/mithril
            - name: run
              mountPath: /run/mithril
            # The host lease prevents two privileged Interceptor owners on one Node.
            - name: interceptor-run
              mountPath: /run/erebor-interceptor
            - name: container-runtime
              # The runtime can replace its socket inode without replacing this Pod.
              mountPath: {{ $containerRuntimeDirectory | quote }}
              readOnly: true
{{- if $runtimeHookInjectorEnabled }}
        - name: runtime-hook-injector
          image: {{ .Values.node.runtimeHook.injector.image | quote }}
          imagePullPolicy: {{ .Values.node.runtimeHook.injector.imagePullPolicy }}
          args: ["-idx", {{ .Values.node.runtimeHook.injector.pluginIndex | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 2m
              memory: 5Mi
          volumeMounts:
            - name: nri-socket
              mountPath: /var/run/nri/nri.sock
            # The stock injector watches the same fixed directories as CRI-O.
            - name: nri-hooks-etc
              mountPath: /etc/containers/oci/hooks.d
              readOnly: true
            - name: nri-hooks-share
              mountPath: /usr/share/containers/oci/hooks.d
              readOnly: true
            - name: nri-hooks-libexec
              mountPath: /usr/libexec/oci/hooks.d
              readOnly: true
{{- end }}
      volumes:
        - name: node-config
          hostPath:
            path: {{ .Values.node.configHostPath | quote }}
            type: File
        - name: node-identity
          hostPath:
            path: {{ .Values.node.identityHostPath | quote }}
            type: Directory
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: tracing
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: state
          hostPath:
            path: {{ .Values.node.stateHostPath | quote }}
            type: DirectoryOrCreate
        - name: run
          hostPath:
            path: {{ .Values.node.runHostPath | quote }}
            type: DirectoryOrCreate
        - name: interceptor-run
          hostPath:
            path: /run/erebor-interceptor
            type: DirectoryOrCreate
        - name: container-runtime
          hostPath:
            path: {{ $containerRuntimeDirectory | quote }}
            type: Directory
        - name: runtime-hook-source
          configMap:
            name: mithril-runtime-hook
        - name: runtime-hook-bin
          hostPath:
            path: {{ .Values.node.runtimeHook.hostBinaryDirectory | quote }}
            type: DirectoryOrCreate
        - name: runtime-hook-config
          hostPath:
            # The parent mount permits same-filesystem atomic publication from
            # outside the NRI-watched directory.
            path: {{ $runtimeHookConfigParent | quote }}
            type: DirectoryOrCreate
{{- if $runtimeHookInjectorEnabled }}
        - name: nri-socket
          hostPath:
            path: {{ .Values.node.runtimeHook.injector.hostSocketPath | quote }}
            type: Socket
        - name: nri-hooks-etc
          hostPath:
            path: /etc/containers/oci/hooks.d
            type: DirectoryOrCreate
        - name: nri-hooks-share
          hostPath:
            path: /usr/share/containers/oci/hooks.d
            type: DirectoryOrCreate
        - name: nri-hooks-libexec
          hostPath:
            path: /usr/libexec/oci/hooks.d
            type: DirectoryOrCreate
{{- end }}
{{- if $migrateLegacyRuntimeHook }}
        - name: runtime-hook-legacy-bin
          hostPath:
            path: {{ $legacyRuntimeHookBinaryDirectory | quote }}
            type: DirectoryOrCreate
{{- end }}
