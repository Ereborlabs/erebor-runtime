{{- $runtimeHookOwner := printf "%s/%s" .Release.Namespace .Release.Name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mithril-runtime-hook-cleanup
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mithril-runtime-hook-cleanup
rules:
  # The coordinator can observe and remove only the chart cleanup DaemonSet.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["mithril-runtime-hook-cleanup"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mithril-runtime-hook-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mithril-runtime-hook-cleanup
subjects:
  - kind: ServiceAccount
    name: mithril-runtime-hook-cleanup
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mithril-runtime-hook-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    # The coordinator deletes this hook only after every Pod reports cleanup.
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app.kubernetes.io/name: mithril-runtime-hook-cleanup
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mithril-runtime-hook-cleanup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mithril-runtime-hook-cleanup
    spec:
      serviceAccountName: mithril-node
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      tolerations:
        # Cleanup must reach each selected Node even if its taints changed after install.
        - operator: Exists
{{- with .Values.node.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.node.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: remove-runtime-hook
          image: {{ .Values.node.image | quote }}
          imagePullPolicy: {{ .Values.node.imagePullPolicy }}
          command: ["/bin/sh", "/hook-source/runtime-hook-owner.sh"]
          args:
            # The hold keeps each Pod Ready until the coordinator observes it.
            - cleanup-and-hold
            - {{ $runtimeHookOwner | quote }}
            - /host-hook-bin
            - /host-hook-config
            - /run/mithril-hook-cleanup/complete
          readinessProbe:
            exec:
              command: ["/usr/bin/test", "-f", "/run/mithril-hook-cleanup/complete"]
            failureThreshold: 30
            periodSeconds: 1
            timeoutSeconds: 1
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime-hook-source
              mountPath: /hook-source
              readOnly: true
            - name: runtime-hook-bin
              mountPath: /host-hook-bin
            - name: runtime-hook-config
              mountPath: /host-hook-config
            - name: cleanup-state
              mountPath: /run/mithril-hook-cleanup
      volumes:
        - name: runtime-hook-source
          configMap:
            name: mithril-runtime-hook
        - name: runtime-hook-bin
          hostPath:
            path: {{ .Values.node.runtimeHook.hostBinaryDirectory | quote }}
            type: DirectoryOrCreate
        - name: runtime-hook-config
          hostPath:
            path: {{ .Values.node.runtimeHook.hostConfigDirectory | quote }}
            type: DirectoryOrCreate
        - name: cleanup-state
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mithril-runtime-hook-cleanup-wait
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: mithril-runtime-hook-cleanup-wait
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mithril-runtime-hook-cleanup-wait
    spec:
      serviceAccountName: mithril-runtime-hook-cleanup
      automountServiceAccountToken: true
      restartPolicy: Never
      tolerations:
        # The coordinator must run when all selected Nodes are quarantined.
        - operator: Exists
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      # Helm waits for this Job after it loads the cleanup DaemonSet hook.
      initContainers:
        - name: wait-for-node-cleanup
          image: {{ .Values.node.runtimeHook.cleanupImage | quote }}
          imagePullPolicy: {{ .Values.node.runtimeHook.cleanupImagePullPolicy }}
          command: ["kubectl"]
          args:
            - rollout
            - status
            - daemonset/mithril-runtime-hook-cleanup
            - --namespace
            - {{ .Release.Namespace | quote }}
            - --timeout=240s
            - --cache-dir=/tmp/kubectl-cache
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kubectl-tmp
              mountPath: /tmp
      containers:
        - name: remove-cleanup-daemonset
          image: {{ .Values.node.runtimeHook.cleanupImage | quote }}
          imagePullPolicy: {{ .Values.node.runtimeHook.cleanupImagePullPolicy }}
          command: ["kubectl"]
          args:
            - delete
            - daemonset/mithril-runtime-hook-cleanup
            - --namespace
            - {{ .Release.Namespace | quote }}
            - --wait=true
            - --timeout=30s
            - --cache-dir=/tmp/kubectl-cache
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kubectl-tmp
              mountPath: /tmp
      volumes:
        - name: kubectl-tmp
          emptyDir: {}
