{{/* Keep the OCI runtime deadline outside the node client deadline. */}}
{{- if .Values.node.runtimeHook.install }}
{{- if le (mul (int .Values.node.runtimeHook.runtimeTimeoutSeconds) 1000) (int .Values.node.runtimeHook.timeoutMs) }}
{{- fail "node.runtimeHook.runtimeTimeoutSeconds must exceed node.runtimeHook.timeoutMs" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mithril-runtime-hook
data:
  runtime-hook-owner.sh: |-
{{ .Files.Get "files/runtime-hook-owner.sh" | indent 4 }}
{{- if .Values.node.runtimeHook.install }}
  98-mithril-runtime-stage.json: |-
    {
      "version": "1.0.0",
      "hook": {
        "path": {{ printf "%s/mithril-oci-hook" .Values.node.runtimeHook.hostBinaryDirectory | quote }},
        "args": [
          "mithril-oci-hook",
          "--stage",
          "stage-runtime-facts",
          "--socket",
          {{ .Values.node.runtimeHook.socketPath | quote }},
          "--timeout-ms",
          {{ .Values.node.runtimeHook.timeoutMs | quote }}
        ],
        "env": [{{ printf "RUST_LOG=%s" .Values.node.logFilter | quote }}],
        "timeout": {{ .Values.node.runtimeHook.runtimeTimeoutSeconds }}
      },
      "when": {
        "annotations": {
          "^mithril\\.erebor\\.dev/profile-id$": ".+"
        }
      },
      "stages": ["createRuntime"]
    }
  99-mithril-runtime-admission.json: |-
    {
      "version": "1.0.0",
      "hook": {
        "path": {{ printf "%s/mithril-oci-hook" .Values.node.runtimeHook.hostBinaryDirectory | quote }},
        "args": [
          "mithril-oci-hook",
          "--stage",
          "prepare-container",
          "--socket",
          {{ .Values.node.runtimeHook.socketPath | quote }},
          "--timeout-ms",
          {{ .Values.node.runtimeHook.timeoutMs | quote }}
        ],
        "env": [{{ printf "RUST_LOG=%s" .Values.node.logFilter | quote }}],
        "timeout": {{ .Values.node.runtimeHook.runtimeTimeoutSeconds }}
      },
      "when": {
        "annotations": {
          "^mithril\\.erebor\\.dev/profile-id$": ".+"
        }
      },
      "stages": ["createRuntime"]
    }
  99-mithril-runtime-entry-preparation.json: |-
    {
      "version": "1.0.0",
      "hook": {
        "path": {{ printf "%s/mithril-oci-hook" .Values.node.runtimeHook.hostBinaryDirectory | quote }},
        "args": [
          "mithril-oci-hook",
          "--stage",
          "prepare-declared-entries",
          "--socket",
          {{ .Values.node.runtimeHook.socketPath | quote }},
          "--timeout-ms",
          {{ .Values.node.runtimeHook.timeoutMs | quote }}
        ],
        "env": [{{ printf "RUST_LOG=%s" .Values.node.logFilter | quote }}],
        "timeout": {{ .Values.node.runtimeHook.runtimeTimeoutSeconds }}
      },
      "when": {
        "annotations": {
          "^mithril\\.erebor\\.dev/profile-id$": ".+"
        }
      },
      "stages": ["createContainer"]
    }
{{- end }}
