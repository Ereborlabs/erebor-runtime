node:
  image: ereborlabs/mithril-node:dev
  imagePullPolicy: IfNotPresent
  configHostPath: /etc/mithril/node.json
  identityHostPath: /etc/mithril/identity
  stateHostPath: /var/lib/mithril
  runHostPath: /run/mithril
  containerRuntimeSocket: /run/containerd/containerd.sock
  nodeSelector: {}
  affinity: {}
  runtimeHook:
    install: true
    injector:
      enabled: true
      image: ghcr.io/containerd/nri/plugins/hook-injector:v0.10.0
      imagePullPolicy: IfNotPresent
      hostSocketPath: /var/run/nri/nri.sock
      pluginIndex: "10"
    cleanupImage: registry.k8s.io/kubectl:v1.35.5
    cleanupImagePullPolicy: IfNotPresent
    hostBinaryDirectory: /usr/libexec/oci/hooks.d
    hostConfigDirectory: /usr/share/containers/oci/hooks.d
    socketPath: /run/mithril/runtime-admission.sock
    timeoutMs: 4000
    runtimeTimeoutSeconds: 5

control:
  enabled: true
  image: ereborlabs/mithril-control:dev
  imagePullPolicy: IfNotPresent
  configSecretName: mithril-control-config
  statePersistentVolumeClaim: mithril-control-state
  grpcPort: 8443
  nodeSelector: {}
  admission:
    enabled: true
    port: 9443
    tlsSecretName: mithril-admission-tls
    caBundle: ""
    webhookTimeoutSeconds: 5
